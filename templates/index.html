<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>稿件管理系統 - 軟體工程期中作業</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1 class="mb-4">📝 稿件管理系統 (FastAPI 版本)</h1>
    
    <!-- 身分角色切換 -->
    <div class="mb-3">
        <label class="form-label fw-bold">選擇身分角色：</label>
        <select id="roleSelect" class="form-select w-auto d-inline-block" onchange="switchRole()">
            <option value="author">作者 (Author)</option>
            <option value="editor">編輯 (Editor)</option>
        </select>
    </div>

    <!-- 作者視角 -->
    <div id="authorSection" class="card p-4 mb-4">
        <h3>作者功能：投稿管理</h3>
        <form id="articleForm" class="row g-3 mb-3" onsubmit="createArticle(event)">
            <div class="col-md-3"><input type="text" id="authorName" class="form-control" placeholder="作者姓名" required></div>
            <div class="col-md-3"><input type="text" id="category" class="form-control" placeholder="類別" required></div>
            <div class="col-md-6"><input type="text" id="title" class="form-control" placeholder="標題" required></div>
            <div class="col-12"><textarea id="content" class="form-control" placeholder="文章內容" required></textarea></div>
            <div class="col-12"><button type="submit" class="btn btn-primary">新增投稿 (編輯中)</button></div>
        </form>
        
        <h4>我的投稿清單</h4>
        <table class="table table-bordered">
            <thead><tr><th>類別</th><th>標題</th><th>狀態</th><th>操作</th></tr></thead>
            <tbody id="authorTableBody"></tbody>
        </table>
    </div>

    <!-- 編輯視角 -->
    <div id="editorSection" class="card p-4 mb-4" style="display:none;">
        <h3>編輯功能：待審查清單</h3>
        <table class="table table-bordered">
            <thead><tr><th>作者</th><th>類別</th><th>標題</th><th>狀態</th><th>審查操作</th></tr></thead>
            <tbody id="editorTableBody"></tbody>
        </table>
    </div>

<script>
async function fetchArticles() {
    const res = await fetch('/api/articles');
    const articles = await res.json();
    renderTables(articles);
}

function switchRole() {
    const role = document.getElementById('roleSelect').value;
    document.getElementById('authorSection').style.display = role === 'author' ? 'block' : 'none';
    document.getElementById('editorSection').style.display = role === 'editor' ? 'block' : 'none';
}

function renderTables(articles) {
    const authorBody = document.getElementById('authorTableBody');
    const editorBody = document.getElementById('editorTableBody');
    authorBody.innerHTML = '';
    editorBody.innerHTML = '';

    articles.forEach(a => {
        let statusText = { 'draft': '編輯中', 'reviewing': '審查中', 'approved': '已通過' }[a.status];

        // 作者表格
        authorBody.innerHTML += `<tr>
            <td>${a.category}</td>
            <td>${a.title}</td>
            <td>${statusText}</td>
            <td>
                ${a.status === 'draft' ? `<button class="btn btn-sm btn-success" onclick="updateStatus(${a.id}, 'reviewing')">送出審查</button>` : ''}
                ${a.status === 'draft' ? `<button class="btn btn-sm btn-danger" onclick="deleteArticle(${a.id})">刪除</button>` : ''}
            </td>
        </tr>`;

        // 編輯表格
        if (a.status === 'reviewing' || a.status === 'approved') {
            editorBody.innerHTML += `<tr>
                <td>${a.author}</td>
                <td>${a.category}</td>
                <td>${a.title}</td>
                <td>${statusText}</td>
                <td>
                    ${a.status === 'reviewing' ? `
                        <button class="btn btn-sm btn-success" onclick="updateStatus(${a.id}, 'approved')">通過</button>
                        <button class="btn btn-sm btn-warning" onclick="updateStatus(${a.id}, 'draft')">退回</button>
                    ` : '已完成審查'}
                </td>
            </tr>`;
        }
    });
}

async function createArticle(e) {
    e.preventDefault();
    await fetch('/api/articles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            author: document.getElementById('authorName', ).value,
            category: document.getElementById('category').value,
            title: document.getElementById('title').value,
            content: document.getElementById('content').value
        })
    });
    document.getElementById('articleForm').reset();
    fetchArticles();
}

async function deleteArticle(id) {
    await fetch(`/api/articles/${id}`, { method: 'DELETE' });
    fetchArticles();
}

async function updateStatus(id, status) {
    await fetch(`/api/articles/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
    });
    fetchArticles();
}

fetchArticles();
</script>
</body>
</html>
